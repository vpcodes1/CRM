          });

          const getCurrencySymbol = (currency) => {
            return currency === 'RSD' ? 'дин.' : '€';
          };

          const generateInvoiceNumber = () => {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const count = invoices.filter(i => i.issueDate.includes(year + '-' + month)).length + 1;
            return `ФА-${year}${month}-${String(count).padStart(4, '0')}`;
          };

          const addClient = () => {
            if (!clientForm.name || !clientForm.email) {
              alert('Popunite naziv i email!');
              return;
            }
            
            const newClient = {
              id: Date.now(),
              ...clientForm,
              createdDate: new Date().toLocaleDateString('sr-RS'),
              history: [],
              totalOffers: 0,
              totalAmount: 0
            };
            
            setClients([newClient, ...clients]);
            setClientForm({ name: '', pib: '', email: '', phone: '', address: '', city: '', notes: '' });
            setShowClientForm(false);
            alert('Klijent dodan!');
          };

          const updateClient = () => {
            if (!clientForm.name || !clientForm.email) {
              alert('Popunite naziv i email!');
              return;
            }

            setEditingClient(null);
            setClientForm({ name: '', pib: '', email: '', phone: '', address: '', city: '', notes: '' });
            setShowClientForm(false);
            alert('Klijent ažuriran!');
          };

            if (confirm('Sigurno želiš da obrišeš ovog klijenta?')) {
              setClients(clients.filter(c => c.id !== id));
              setSelectedClient(null);
            }
          };

            c.email.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.pib.includes(searchTerm)
          );
const calculateReminderDate = (daysFromNow) => {
  const date = new Date();
  date.setDate(date.getDate() + daysFromNow);
  return date.toISOString().split('T')[0];
};

const addReminder = () => {
  if (!newReminder.clientId || !newReminder.description.trim()) {
    alert('Izaberi klijenta i unesi opis!');
    return;
  }

  const reminderDate = calculateReminderDate(newReminder.daysFromNow);
  const reminder = {
    id: Date.now(),
    clientId: newReminder.clientId,
    clientName: newReminder.clientName,
    description: newReminder.description,
    reminderDate: reminderDate,
    createdDate: new Date().toLocaleDateString('sr-RS'),
    completed: false
  };

  setReminders([reminder, ...reminders]);
  setNewReminder({ clientId: '', clientName: '', description: '', daysFromNow: 7, reminderDate: '' });
  setShowReminderForm(false);
  alert('✓ Reminder postavljen za ' + reminderDate);
};

const completeReminder = (id) => {
  setReminders(reminders.map(r => r.id === id ? {...r, completed: true} : r));
};

const deleteReminder = (id) => {
  if (confirm('Obriši reminder?')) {
    setReminders(reminders.filter(r => r.id !== id));
  }
};

const getDueReminders = () => {
  const today = new Date().toISOString().split('T')[0];
  return reminders.filter(r => !r.completed && r.reminderDate <= today);
};

const getUpcomingReminders = () => {
  const today = new Date().toISOString().split('T')[0];
  return reminders.filter(r => !r.completed && r.reminderDate > today).sort((a, b) => new Date(a.reminderDate) - new Date(b.reminderDate));
};

const getCompletedReminders = () => {
  return reminders.filter(r => r.completed);
};
          const handleCreateOffer = () => {
            if (!selectedClient) {
              alert('Prvo izaberi klijenta!');
              return;
            }
            if (!formData.title || formData.title.trim() === '') {
              alert('Unesi naslov ponude!');
              return;
            }
            if (!formData.items || formData.items.length === 0) {
              alert('Nema stavki u ponudi!');
              return;
            }

            const subtotal = formData.items.reduce((sum, item) => sum + (item.quantity * item.price), 0);
            const totalDiscount = formData.items.reduce((sum, item) => {
              const discount = item.discount || 0;
              const type = item.discountType || '%';
              const basePrice = item.quantity * item.price;
              return sum + (type === '%' ? (basePrice * discount) / 100 : discount);
            }, 0);
            const totalAmount = subtotal - totalDiscount;

            const newOffer = {
              id: Date.now(),
              clientId: selectedClient.id,
              clientName: selectedClient.name,
              title: formData.title,
              items: formData.items,
              status: 'pending',
              createdDate: new Date().toLocaleDateString('sr-RS'),
              subtotal: subtotal,
              totalDiscount: totalDiscount,
              totalAmount: totalAmount,
              note: formData.note || ''
            };

            setOffers([newOffer, ...offers]);
            
            const updatedClients = clients.map(c => {
              if (c.id === selectedClient.id) {
                return {
                  ...c,
                  history: [{
                    type: 'offer',
                    title: formData.title,
                    date: new Date().toLocaleDateString('sr-RS'),
                    amount: totalAmount,
                    offerId: newOffer.id
                  }, ...c.history],
                  totalOffers: c.totalOffers + 1,
                  totalAmount: c.totalAmount + totalAmount
                };
              }
              return c;
            });
            
            setClients(updatedClients);

            setFormData({
              clientName: '', title: '', items: [], parseStep: 'upload', selectedSheet: '',
              sheetData: [], headers: [], extractedImages: [], allSheetsData: null,
              columnMapping: { description: '', price: '', quantity: '', dimensions: '', weight: '', volume: '' },
              discount: 0,
              discountType: '%',
              note: ''
            });
            
            alert('✓ Ponuda kreirana!');
            setActiveTab('offers');
          };

          const handleCreateInvoice = () => {
            if (!selectedOffer) {
              alert('Prvo izaberi ponudu!');
              return;
            }

            const subtotal = selectedOffer.items.reduce((sum, item) => sum + (item.quantity * item.price), 0);
            const vatAmount = (subtotal * invoiceForm.vatRate) / 100;
            const totalAmount = subtotal + vatAmount;

            const newInvoice = {
              id: Date.now(),
              invoiceNumber: invoiceForm.invoiceNumber || generateInvoiceNumber(),
              offerId: selectedOffer.id,
              clientId: selectedOffer.clientId,
              clientName: selectedOffer.clientName,
              offerTitle: selectedOffer.title,
              items: selectedOffer.items,
              issueDate: invoiceForm.issueDate,
              dueDate: invoiceForm.dueDate,

              vatAmount: vatAmount,

              status: invoiceForm.status,
              paymentTerms: invoiceForm.paymentTerms,
              notes: invoiceForm.notes,
              currency: invoiceForm.currency,
              createdDate: new Date().toLocaleDateString('sr-RS')

            alert('✓ Faktura kreirana: ' + newInvoice.invoiceNumber);

ueDate + '</p><p><strong>Valuta:</strong> ' + invoice.currency + '</p></div></div><div class="invoice-info"><div class="info-section"><strong>Izdavač:</strong><p><strong>' + companyInfo.name + '</strong></p><p>PIB: ' + companyInfo.pib + '</p><p>' + companyInfo.address + ', ' + companyInfo.city + '</p><p>Email: ' + companyInfo.email + '</p><p>Telefon: ' + companyInfo.phone + '</p>' + (companyInfo.bankAccount ? '<p>Račun: ' + companyInfo.bankAccount + '</p>' : '') + '</div><div class="info-section"><strong>Naručilac:</strong><p><strong>' + invoice.clientName + '</strong></p><p>Rok plaćanja: ' + (invoice.dueDate || 'Odmah') + '</p><span class="status ' + (invoice.status === 'paid' ? 'paid' : invoice.status === 'overdue' ? 'overdue' : 'issued') + '">' + invoice.status.toUpperCase() + '</span></div></div><table><thead><tr><th>Redni broj</th><th>Opis stavke</th><th style="text-align:right">Količina</th><th style="text-align:right">Cena po komadu</th><th style="text-align:center">Popust</th><th style="text-align:right">Iznos (' + currencySymbol + ')</th></tr></thead><tbody>' + itemsHtml + '</tbody></table><div class="totals"><div class="total-row"><span>Ukupno bez PDV-a:</span><strong>' + invoice.subtotal.toFixed(2) + ' ' + currencySymbol + '</strong></div><div class="total-row"><span>PDV (' + invoice.vatRate + '%):</span><strong>' + invoice.vatAmount.toFixed(2) + ' ' + currencySymbol + '</strong></div><div class="total-row highlight"><span>UKUPNO ZA PLAĆANJE:</span><strong>' + invoice.totalAmount.toFixed(2) + ' ' + currencySymbol + '</strong></div></div>' + (invoice.notes ? '<div style="margin-top:20px;padding:15px;background:#FEF3C7;border-radius:5px"><strong>Napomena:</strong> ' + invoice.notes + '</div>' : '') + (companyInfo.notes ? '<div style="margin-top:15px;padding:15px;background:#f0f0f0;border-radius:5px"><strong>Dodatne napomene:</strong> ' + companyInfo.notes + '</div>' : '') + '<div class="footer"><p>Ova faktura je izdata u skladu sa Zakonom o PDV-u Republike             const blob = new Blob([html], { type: 'text/html;charset=utf-8' });

                    <label className="block text-sm font-semibold mb-1">Cena €</label>
                    <input 
                      type="number" 
                      step="0.01"
                      min="0"
                      value={newQuickItem.price}
                      onChange={(e) => setNewQuickItem({...newQuickItem, price: parseFloat(e.target.value) || 0})}
                      className="w-full border rounded px-3 py-2"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold mb-1">Popust</label>
                    <div className="flex gap-2">
                      <input 
                        type="number" 
                        step="0.1"
                        min="0"
                        value={newQuickItem.discount}
                        onChange={(e) => setNewQuickItem({...newQuickItem, discount: parseFloat(e.target.value) || 0})}
                        className="flex-1 border rounded px-3 py-2"
                      />
                      <select 
                        value={newQuickItem.discountType}
                        onChange={(e) => setNewQuickItem({...newQuickItem, discountType: e.target.value})}
                        className="w-12 border rounded px-2 py-2"
                      >
                        <option value="%">%</option>
                        <option value="€">€</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>

              <button 
                onClick={() => {
                  if (!newQuickItem.description.trim()) {
                    alert('Unesi opis stavke!');
                    return;
                  }
                  if (newQuickItem.price <= 0) {
                    alert('Unesi cenu!');
                    return;
                  }
                  setQuickOfferData({
                    ...quickOfferData,
                    items: [...quickOfferData.items, {...newQuickItem, id: Date.now()}]
                  });
                  setNewQuickItem({description: '', quantity: 1, price: 0, discount: 0, discountType: '%'});
                }}
                className="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700"
              >
                + Dodaj Stavku
              </button>
            </div>

            {/* LISTA STAVKI */}
            {quickOfferData.items.length === 0 ? (
              <div className="text-center py-8 text-gray-500">
                <p>Nema stavki. Dodaj prvu stavku gore.</p>
              </div>
            ) : (
              <div className="space-y-3 mb-6">
                <p className="font-bold">Stavke ({quickOfferData.items.length}):</p>
                <div className="bg-white rounded border max-h-80 overflow-y-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="bg-gray-100 border-b">
                        <th className="p-2 text-left">Opis</th>
                        <th className="p-2 text-center w-12">Kom</th>
                        <th className="p-2 text-center w-16">Cena</th>
                        <th className="p-2 text-center w-16">Popust</th>
                        <th className="p-2 text-right w-16">Ukupno</th>
                        <th className="p-2 text-center w-10"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {quickOfferData.items.map((item, idx) => {
                        const basePrice = item.quantity * item.price;
                        const discount = item.discount || 0;
                        const discountType = item.discountType || '%';
                        const discountAmount = discountType === '%' ? (basePrice * discount) / 100 : discount;
                        const finalPrice = basePrice - discountAmount;
                        
                        return (
                          <tr key={item.id} className="border-b hover:bg-gray-50">
                            <td className="p-2">{item.description}</td>
                            <td className="p-2 text-center">{item.quantity}</td>
                            <td className="p-2 text-center">{item.price.toFixed(2)}</td>
                            <td className="p-2 text-center text-sm">
                              {discount > 0 ? (
                                <span className="text-red-600 font-bold">-{discount}{discountType}</span>
                              ) : (
                                <span className="text-gray-400">-</span>
                              )}
                            </td>
                            <td className={`p-2 text-right font-bold ${discount > 0 ? 'text-green-600' : ''}`}>
                              {finalPrice.toFixed(2)}
                            </td>
                            <td className="p-2 text-center">
                              <button 
                                onClick={() => setQuickOfferData({
                                  ...quickOfferData,
                                  items: quickOfferData.items.filter(i => i.id !== item.id)
                                })}
                                className="text-red-500 hover:text-red-700 font-bold"
                              >
                                ✕
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* DUGME ZA KREIRANJE */}
            {quickOfferData.items.length > 0 && quickOfferData.offerTitle && (
              <div className="flex gap-3">
                <button 
                  onClick={() => {
                    setQuickOfferData({offerTitle: '', items: []});
                    setSelectedClient(null);
                    setNewQuickItem({description: '', quantity: 1, price: 0, discount: 0, discountType: '%'});
                  }}
                  className="flex-1 bg-gray-400 text-white py-2 rounded hover:bg-gray-500 font-bold"
                >
                  Resetuj
                </button>
                <button 
                  onClick={() => {
                    const subtotal = quickOfferData.items.reduce((sum, item) => sum + (item.quantity * item.price), 0);
                    const totalDiscount = quickOfferData.items.reduce((sum, item) => {
                      const discount = item.discount || 0;
                      const type = item.discountType || '%';
                      const basePrice = item.quantity * item.price;
                      return sum + (type === '%' ? (basePrice * discount) / 100 : discount);
                    }, 0);
                    const totalAmount = subtotal - totalDiscount;

                    const newOffer = {
                      id: Date.now(),
                      clientId: selectedClient.id,
                      clientName: selectedClient.name,
                      title: quickOfferData.offerTitle,
                      items: quickOfferData.items.map(({id, ...item}) => item),
                      status: 'pending',
                      createdDate: new Date().toLocaleDateString('sr-RS'),
                      subtotal: subtotal,
                      totalDiscount: totalDiscount,
                      totalAmount: totalAmount,
                      note: ''
                    };

                    setOffers([newOffer, ...offers]);
                    setClients(clients.map(c => c.id === selectedClient.id ? {
                      ...c,
                      history: [{
                        type: 'offer',
                        title: quickOfferData.offerTitle,
                        date: new Date().toLocaleDateString('sr-RS'),
                        amount: totalAmount,
                        offerId: newOffer.id
                      }, ...c.history],
                      totalOffers: c.totalOffers + 1,
                      totalAmount: c.totalAmount + totalAmount
                    } : c));

                    alert('✓ Ponuda kreirana!');
                    setQuickOfferData({offerTitle: '', items: []});
                    setSelectedClient(null);
                    setNewQuickItem({description: '', quantity: 1, price: 0, discount: 0, discountType: '%'});
                    setActiveTab('offers');
                  }}
                  className="flex-1 bg-green-600 text-white py-2 rounded hover:bg-green-700 font-bold"
                >
                  Kreiraj Ponudu
                </button>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  </div>
)}
{activeTab === 'reminders' && (
  <div className="space-y-6">
    {/* FORM ZA DODAVANJE REMINDEREA */}
    <div className="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-lg p-6 border-2 border-indigo-200">
      <div className="flex justify-between items-center mb-4">
        <h2 className="text-2xl font-bold">Postavireminder za Follow-up</h2>
        <button 
          onClick={() => setShowReminderForm(!showReminderForm)}
          className="px-4 py-2 bg-green-500 text-white rounded font-bold hover:bg-green-600"
        >
          + Novi Reminder
        </button>
      </div>

      {showReminderForm && (
        <div className="bg-white rounded-lg p-4 border-2 border-indigo-300">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label className="block font-semibold mb-2 text-sm">Klijent *</label>
              <select 
                value={newReminder.clientId}
                onChange={(e) => {
                  const client = clients.find(c => c.id === parseInt(e.target.value));
                  if (client) {
                    setNewReminder({...newReminder, clientId: e.target.value, clientName: client.name});
                  }
                }}
                className="w-full border rounded px-3 py-2"
              >
                <option value="">-- Odaberi Klijenta --</option>
                {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>

            <div>
              <label className="block font-semibold mb-2 text-sm">Za N Dana *</label>
              <div className="flex gap-2">
                <input 
                  type="number"
                  min="1"
                  value={newReminder.daysFromNow}
                  onChange={(e) => setNewReminder({...newReminder, daysFromNow: parseInt(e.target.value) || 1})}
                  className="w-20 border rounded px-3 py-2"
                />
                <div className="flex-1 flex items-center text-sm text-gray-600">
                  Datum: <span className="font-bold ml-2">{calculateReminderDate(newReminder.daysFromNow)}</span>
                </div>
              </div>
            </div>
          </div>

          <div className="mb-4">
            <label className="block font-semibold mb-2 text-sm">Šta trebam da uradim? *</label>
            <textarea 
              placeholder="Npr: Proveriti status ponude, pozvati klijenta, slati mejl..."
              value={newReminder.description}
              onChange={(e) => setNewReminder({...newReminder, description: e.target.value})}
              rows="3"
              className="w-full border rounded px-3 py-2"
            />
          </div>

          <div className="flex gap-3">
            <button 
              onClick={() => setShowReminderForm(false)}
              className="flex-1 bg-gray-400 text-white py-2 rounded hover:bg-gray-500"
            >
              Otkaži
            </button>
            <button 
              onClick={addReminder}
              className="flex-1 bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700"
            >
              Postavi Reminder
            </button>
          </div>
        </div>
      )}
    </div>

    {/* DUE REMINDERS - HITNI */}
    {getDueReminders().length > 0 && (
      <div className="bg-red-50 rounded-lg p-6 border-2 border-red-300">
        <h3 className="text-xl font-bold text-red-900 mb-4">🔴 Reminderi za SADA ({getDueReminders().length})</h3>
        <div className="space-y-3">
          {getDueReminders().map(reminder => (
            <div key={reminder.id} className="bg-white p-4 rounded border-l-4 border-red-500">
              <div className="flex justify-between items-start">
                <div className="flex-1">
                  <p className="font-bold text-lg">{reminder.clientName}</p>
                  <p className="text-gray-700 mt-1">{reminder.description}</p>
                  <p className="text-xs text-gray-500 mt-2">Postavljeno: {reminder.createdDate}</p>
                </div>
                <div className="flex gap-2">
                  <button 
                    onClick={() => completeReminder(reminder.id)}
                    className="px-3 py-1 bg-green-500 text-white rounded text-sm hover:bg-green-600 font-bold"
                  >
                    ✓ Urađeno
                  </button>
                  <button 
                    onClick={() => deleteReminder(reminder.id)}
                    className="px-3 py-1 bg-red-500 text-white rounded text-sm hover:bg-red-600"
                  >
                    Obriši
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    )}

    {/* UPCOMING REMINDERS */}
    {getUpcomingReminders().length > 0 && (
      <div className="bg-yellow-50 rounded-lg p-6 border-2 border-yellow-300">
        <h3 className="text-xl font-bold text-yellow-900 mb-4">⏰ Predstojeći Reminderi ({getUpcomingReminders().length})</h3>
        <div className="space-y-3">
          {getUpcomingReminders().map(reminder => {
            const today = new Date();
            const reminderDateObj = new Date(reminder.reminderDate);
            const daysUntil = Math.ceil((reminderDateObj - today) / (1000 * 60 * 60 * 24));
            
            return (
              <div key={reminder.id} className="bg-white p-4 rounded border-l-4 border-yellow-500">
                <div className="flex justify-between items-start">
                  <div className="flex-1">
                    <div className="flex items-center gap-3">
                      <p className="font-bold text-lg">{reminder.clientName}</p>
                      <span className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">
                        {daysUntil === 1 ? 'Sutra' : 'Za ' + daysUntil + ' dana'}
                      </span>
                    </div>
                    <p className="text-gray-700 mt-1">{reminder.description}</p>
                    <p className="text-xs text-gray-500 mt-2">Datum: {reminder.reminderDate}</p>
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => completeReminder(reminder.id)}
                      className="px-3 py-1 bg-green-500 text-white rounded text-sm hover:bg-green-600 font-bold"
                    >
                      ✓ Urađeno
                    </button>
                    <button 
                      onClick={() => deleteReminder(reminder.id)}
                      className="px-3 py-1 bg-red-500 text-white rounded text-sm hover:bg-red-600"
                    >
                      Obriši
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    )}

    {/* COMPLETED REMINDERS */}
    {getCompletedReminders().length > 0 && (
      <div className="bg-green-50 rounded-lg p-6 border-2 border-green-300">
        <h3 className="text-xl font-bold text-green-900 mb-4">✓ Završeni Reminderi ({getCompletedReminders().length})</h3>
        <div className="space-y-2">
          {getCompletedReminders().map(reminder => (
            <div key={reminder.id} className="bg-white p-3 rounded opacity-60">
              <div className="flex justify-between items-center">
                <div>
                  <p className="font-semibold text-gray-600 line-through">{reminder.clientName}</p>
                  <p className="text-sm text-gray-500">{reminder.description}</p>
                </div>
                <button 
                  onClick={() => deleteReminder(reminder.id)}
                  className="text-red-500 hover:text-red-700 text-sm"
                >
                  Obriši
                </button>
              </div>
            </div>
          ))}
        </div>
      </div>
    )}

    {reminders.length === 0 && (
      <div className="text-center py-12 text-gray-500">
        <p className="text-xl mb-2">Nema reminderea</p>
        <p className="text-sm">Postavi prvi reminder gore</p>
      </div>
    )}
  </div>
)}
                {/* Invoice Creation Modal */}
                {showInvoiceForm && selectedOffer && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-lg shadow-2xl p-8 max-w-2xl w-full">
                      <h3 className="text-2xl font-bold mb-6">Kreiraj Fakturu</h3>
                      <div className="grid grid-cols-2 gap-4 mb-4">
                        <div>
                          <label className="block text-sm font-semibold mb-2">Valuta</label>
                          <select value={invoiceForm.currency} onChange={(e) => setInvoiceForm({...invoiceForm, currency: e.target.value})} className="w-full border rounded px-3 py-2">
                            <option value="EUR">EUR (€)</option>
                            <option value="RSD">RSD (дин.)</option>
                          </select>
                        </div>
                        <div><label className="block text-sm font-semibold mb-2">Broj Fakture</label><input type="text" placeholder={generateInvoiceNumber()} value={invoiceForm.invoiceNumber} onChange={(e) => setInvoiceForm({...invoiceForm, invoiceNumber: e.target.value})} className="w-full border rounded px-3 py-2"/></div>
                        <div><label className="block text-sm font-semibold mb-2">Stopa PDV-a (%)</label><input type="number" min="0" max="100" value={invoiceForm.vatRate} onChange={(e) => setInvoiceForm({...invoiceForm, vatRate: parseFloat(e.target.value) || 0})} className="w-full border rounded px-3 py-2"/></div>
                        <div><label className="block text-sm font-semibold mb-2">Datum Izdavanja</label><input type="date" value={invoiceForm.issueDate} onChange={(e) => setInvoiceForm({...invoiceForm, issueDate: e.target.value})} className="w-full border rounded px-3 py-2"/></div>
                        <div><label className="block text-sm font-semibold mb-2">Rok Plaćanja</label><input type="date" value={invoiceForm.dueDate} onChange={(e) => setInvoiceForm({...invoiceForm, dueDate: e.target.value})} className="w-full border rounded px-3 py-2"/></div>
                        <div><label className="block text-sm font-semibold mb-2">Uslovi Plaćanja</label><input type="text" placeholder="Npr: Transfer, Gotovina, Ček" value={invoiceForm.paymentTerms} onChange={(e) => setInvoiceForm({...invoiceForm, paymentTerms: e.target.value})} className="w-full border rounded px-3 py-2"/></div>
                        <div><label className="block text-sm font-semibold mb-2">Status</label><select value={invoiceForm.status} onChange={(e) => setInvoiceForm({...invoiceForm, status: e.target.value})} className="w-full border rounded px-3 py-2"><option value="issued">Izdat</option><option value="paid">Plaćen</option><option value="overdue">Dospeo</option></select></div>
                      </div>
                      <div className="mb-6"><label className="block text-sm font-semibold mb-2">Napomena na Faktturi</label><textarea placeholder="Uslovi, opis usluge..." value={invoiceForm.notes} onChange={(e) => setInvoiceForm({...invoiceForm, notes: e.target.value})} rows="3" className="w-full border rounded px-3 py-2"/></div>
                      <div className="bg-indigo-50 p-4 rounded mb-6">
                        <p className="text-sm text-gray-600">Ponuda: <span className="font-bold">{selectedOffer.title}</span></p>
                        <p className="text-sm text-gray-600">Stavki: <span className="font-bold">{selectedOffer.items.length}</span></p>
                        <p className="text-lg font-bold text-green-600">Iznos: {selectedOffer.totalAmount.toFixed(2)} {getCurrencySymbol(invoiceForm.currency)}</p>
                      </div>
                      <div className="flex gap-3">
                        <button onClick={() => { setShowInvoiceForm(false); setSelectedOffer(null); }} className="flex-1 bg-gray-400 text-white py-2 rounded hover:bg-gray-500">Otkaži</button>
                        <button onClick={handleCreateInvoice} className="flex-1 bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">Kreiraj Fakturu</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        ReactDOM.render(<OfferlyApp />, document.getElementById('root'));
    </script>
  </body>
</html>
